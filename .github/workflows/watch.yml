name: news-watcher

on:
  schedule:
    # 10:00 и 18:00 българско време (UTC+2 зиме, UTC+3 лете). GitHub често закъснява или пропуска
    # пускания точно на кръгъл час, затова има няколко резервни опита. Скриптът сам проверява часа
    # и обхожда само веднъж на слот, останалите опити излизат веднага.
    - cron: "7 7,8,9,10 * * *"
    - cron: "37 7,8,9,10 * * *"
    - cron: "7 15,16,17 * * *"
    - cron: "37 15,16,17 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Оставете празно за нормална работа или напишете --test"
        required: false
        default: ""

permissions:
  contents: write

concurrency: news-watcher

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGS: ${{ inputs.args }}
        run: python agent.py $ARGS
      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update state" && git push)
